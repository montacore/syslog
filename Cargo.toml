[package]
name = "syslog"
version = "0.1.0"
edition = "2024"
default-run = "syslog"

[dependencies]
axum = "0.8.9"
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
futures-util = "0.3.32"
gethostname = "1.1.0"
log = "0.4.31"
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
reqwest-sse = "0.2.0"
time = { version = "0.3.45", features = ["serde-human-readable"] }
toml = "1.1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
uuid = { version = "1.23.1", features = ["v7", "serde"] }
